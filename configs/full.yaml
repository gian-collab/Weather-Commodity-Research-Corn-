seed: 42
corn_belt:
  # Representative agricultural centroids; production weights should be estimated from USDA, not hard-coded.
  regions:
    Iowa: [41.8780, -93.0977]
    Illinois: [40.0000, -89.0000]
    Nebraska: [41.5000, -99.5000]
    Minnesota: [46.0000, -94.0000]
    Indiana: [40.0000, -86.0000]
    Ohio: [40.3000, -82.8000]
    South_Dakota: [44.5000, -100.0000]
    Kansas: [38.5000, -98.0000]
    Missouri: [38.5000, -92.5000]
    Wisconsin: [44.5000, -89.5000]
data_cutoff: '2026-09-20'
weather:
  realized_start: '1981-01-01'
  forecast_start: '2024-03-01'
  horizons_days: [1,2,3,4,5,6,7,8]
  open_meteo_model: ecmwf_ifs025   # fixed model for comparable historical vintages
  request_pause_seconds: 1.25       # polite pacing; chunk failures are preserved as PARTIAL rather than losing the region
market:
  symbol: 'ZC=F'
  start: '2000-01-01'
  horizons_days: [1,3,5,10,20]
validation:
  min_train_years: 8
  final_test_years: 2
hypotheses: [H1_weather_skill,H2_spread_skill,H3_weather_yield,H4_distributional_value,H5_financial_transmission,H6_state_dependence]

yield:
  # 2026 is in-season as of the research date; never treat it as a finalized realized yield.
  max_finalized_crop_year: 2025
  stage_windows_source: coarse_calendar_baseline
market_mechanism:
  lead_days: [1, 3, 5]
  return_horizons: [1, 3, 5, 10]
  vol_horizons: [3, 5, 10]
  growing_months: [4, 5, 6, 7, 8, 9]
  use_lagged_production_weights: true
ensemble:
  prospective_only: true
  model: aifs-ens
  archive_root: data/snapshots/ecmwf
