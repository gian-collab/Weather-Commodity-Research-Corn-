[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="weather-commodity-lab"
version="0.4.2"
description="Point-in-time weather, crop, yield and corn-market research platform"
readme="README.md"
license={file="LICENSE"}
requires-python=">=3.11"
dependencies=["numpy>=1.26","pandas>=2.2","scipy>=1.12","scikit-learn>=1.4","matplotlib>=3.8","requests>=2.31","pyyaml>=6","openpyxl>=3.1"]
[project.optional-dependencies]
market = ["yfinance>=0.2.54"]
parquet=["pyarrow>=15"]
weather=["ecmwf-opendata>=0.3","xarray>=2024.1","cfgrib>=0.9.12"]
dev=["pytest>=8"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
